const adultPrograms=[
["Когда ответственность не даёт отдохнуть", "When responsibility follows you home", "Как отличить полезную подготовку от тревожного прокручивания одного и того же?", "When does useful preparation turn into going over the same worry again?", "Возьмите одну заботу этой недели. Назовите действие, которое в ваших силах, и то, о чём хочется помолиться.", "Choose one concern from this week. Identify one action within your reach and something you want to pray about.", "Пройдитесь вместе несколько минут. На пути туда расскажите о своей заботе, на обратном пути выслушайте собеседника. С какой одной мыслью хочется вернуться домой?", "Take a short walk. On the way out, describe a concern. On the way back, listen to your companion. What thought would you like to take home?"],
["Первый разговор после обиды", "The first conversation after hurt", "Какие слова помогают снова начать разговор после резкого ответа?", "What helps you reopen a conversation after a sharp reply?", "Возьмите вымышленный случай: человек пообещал помочь и забыл. Попробуйте начать разговор так, чтобы назвать обиду и дать собеседнику возможность объясниться.", "Imagine someone promised to help and forgot. Try an opening that acknowledges the hurt and leaves room for an explanation.", "Сядьте на разные стороны стола и произнесите одну фразу от лица каждого. Поменяйтесь местами. Какая реплика помогла услышать другого?", "Sit on opposite sides of a table and try a line from each person’s perspective. Swap seats. Which words helped you hear the other person?"],

["Довольствоваться тем, что есть", "Finding contentment in what we have", "Когда сравнение с другими мешает увидеть, что у нас уже есть?", "When does comparing ourselves with others obscure what we already have?", "Вспомните недавнюю покупку, о которой задумались. Что побудило к ней и как прочитанный отрывок влияет на ваш взгляд?", "Think of something you considered buying recently. What prompted the idea, and how does the passage affect your view?", "Каждый выбирает дома вещь, которая давно и хорошо служит. Покажите её и расскажите, почему её цените.", "Each person finds something in the home that has served them well. Bring it back and explain why you value it."],
["Помочь, не ставя в неловкое положение", "Offering help with dignity", "Как предложить помощь так, чтобы человеку было легко согласиться или отказаться?", "How can we offer help in a way that makes it easy to accept or decline?", "Подумайте о человеке, которому предстоит трудная неделя. Сформулируйте конкретное предложение помощи, оставляющее ему выбор.", "Think of someone facing a hard week. Put a specific offer of help into words that leave them a choice.", "Разыграйте короткую встречу у двери: предложите привезти продукты или подвезти человека. Смените роли и попробуйте ответить на вежливый отказ.", "Act out a doorstep conversation offering groceries or a lift. Switch roles and practise responding to a polite refusal."],
["Мужество начать трудный разговор", "Finding courage for a difficult conversation", "Как Есфирь искала поддержки и что из этого применимо к вашему решению?", "How did Esther seek support, and what might apply to a decision you face?", "Выберите вымышленную ситуацию на работе или дома. К кому обратиться за советом? С какой фразы можно начать сам разговор?", "Choose an imaginary situation at work or home. Who could offer advice? What might your opening sentence be?", "Встаньте по разные стороны комнаты. Один начинает трудный разговор, другой отвечает. Поменяйтесь местами и попробуйте более бережное начало.", "Stand on opposite sides of the room. Practise opening a difficult conversation and responding. Switch sides and try a gentler opening."],
["Благодарность за незаметный труд", "Gratitude for work that goes unseen", "Какую заботу другого человека легко принять как должное?", "Whose quiet efforts are easy to take for granted?", "Назовите один конкретный поступок и скажите, как он на вас повлиял. Подберите слова благодарности, которые можно сказать сегодня.", "Name a specific act of kindness and describe how it affected you. Find words of thanks you could use today.", "Пройдитесь по дому, выберите место, где виден чей-то труд, и расскажите об этом. При желании составьте короткую записку благодарности.", "Walk around your home and find a place where someone’s work is visible. Explain what you noticed and, if you wish, draft a thank-you note."],
["Что можно сделать заранее?", "What could we do in advance?", "Какое небольшое дело сейчас избавит нас от спешки позже?", "What small action now could spare us a rush later?", "Вместе посмотрите на ближайшую неделю. Выберите одно дело, которое стоит начать заранее, и договоритесь о первом посильном шаге.", "Look over the coming week. Choose something worth starting early and agree on one manageable first step.", "Пройдите по обычному утреннему маршруту дома. Найдите одно место, где чаще всего возникает задержка. Что можно подготовить с вечера?", "Walk through your usual morning routine at home. Find one point that often slows you down. What could you prepare the night before?"],
["Выслушать прежде, чем советовать", "Listening before offering advice", "Когда вам особенно важно быть услышанным без немедленных советов?", "When do you most want someone to listen before offering advice?", "Один коротко описывает повседневную трудность. Второй сначала пересказывает услышанное и уточняет: «Я правильно тебя понял?» Затем поменяйтесь.", "Briefly describe an everyday difficulty. Your partner reflects what they heard and asks whether they understood. Swap roles.", "Пройдитесь рядом. До следующего ориентира один говорит, другой слушает; у ориентира слушатель называет услышанную мысль. На обратном пути поменяйтесь.", "Walk side by side. Until the next landmark one person speaks and one listens. At the landmark reflect one thing you heard. Swap on the way back."],
["Не потерять цель в долгом деле", "Staying with a long-term commitment", "Что поддерживает вас, когда результат усилий пока не виден?", "What sustains you when the results of your efforts are still out of sight?", "Вспомните длительное дело, потребовавшее терпения. Сопоставьте его с рассказом о Ное и выберите достижимую цель на эту неделю.", "Recall a long undertaking that required patience. Compare it with Noah’s account and choose a manageable goal for this week.", "Отметьте в комнате старт, нынешний этап и цель одного долгого дела. Пройдите этот путь, вспоминая, кто и что помогло дойти до сегодняшнего дня.", "Mark the beginning, present stage and goal of a long undertaking in the room. Walk the route, recalling who and what helped you get this far."],
["Музыка, которая объединяет поколения", "Music that connects generations", "Почему одна и та же песня может быть дорога двум людям по разным причинам?", "Why might the same song matter to two people for different reasons?", "По очереди выберите песню и расскажите, с каким человеком или периодом жизни она связана. Как это изменило то, что вы слышите в ней теперь?", "Take turns choosing a song linked to a person or period in your life. How has that connection changed what you hear in it today?", "Представьте комнату как шкалу времени. Встаньте там, где впервые запомнили любимую песню, и расскажите о том моменте. Затем спойте её вместе.", "Imagine the room as a timeline. Stand where you first remember a favourite song and share that memory. Then sing it together."]
];
const adultCatalog=catalog.map((base,i)=>{
 const [ru,en,qRu,qEn,taskRu,taskEn]=adultPrograms[i];
 return [base[0],ru,en,base[3],base[4],qRu,qEn,taskRu,taskEn]
});
let sharedAdults=false;
function adultEvening(index=current){
 if(guestTopic!==null)return sharedAdults;
 const participants=s.people.concat(s.guests?.[iso(date(index))]||[]);
 return participants.length>0&&participants.every(p=>p.age!=null&&String(p.age).trim()!==''&&Number(p.age)>=18)
}
function topicAt(index=current){
 const source=adultEvening(index)?adultCatalog:catalog;
 return source[guestTopic??s.plan[index]]
}
const topics=['nature','friends','history','music'];
const options=[['Природа','Nature'],['Дружба','Friendship'],['История','History'],['Музыка','Music']];
const storageKey='evening-together-v1';
let s={};try{s=JSON.parse(localStorage.getItem(storageKey))||{}}catch{}
const systemLanguage=()=>(navigator.languages||[navigator.language]).map(x=>x.slice(0,2)).find(x=>['ru','en'].includes(x))||'en';
let lang,view='home',current=0,guestTopic=null,step=0,draft=[];
const t=(ru,en)=>lang==='ru'?ru:en;
const save=()=>{try{localStorage.setItem(storageKey,JSON.stringify(s))}catch{alert(t('Браузер не смог сохранить изменения на устройстве. Проверьте доступное место и настройки хранения.','Your browser could not save changes on this device. Check available space and storage settings.'))}};
const addDays=(date,n)=>{const d=new Date(date);d.setDate(d.getDate()+n);return d};
const iso=d=>[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-');
const today=new Date();s.start=s.start||iso(addDays(today,(5-today.getDay()+7)%7));s.people=s.people||[];s.weeks=s.weeks||4;s.minutes=s.minutes||40;
function makePlan(){
 const interests=s.people.length?s.people.map(p=>p.topic):topics;
 const used=new Set();
 return Array.from({length:s.weeks},(_,i)=>{
 let id=catalog.findIndex((c,j)=>c[0]===interests[i%interests.length]&&!used.has(j));
 if(id<0)id=catalog.findIndex((_,j)=>!used.has(j));used.add(id);return id})
}
s.plan=s.plan||makePlan();
const date=i=>addDays(new Date(s.start+'T12:00:00'),i*7);
const fmt=i=>date(i).toLocaleDateString(lang,{day:'numeric',month:'short'});
const esc=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function btn(text,fn,primary=false){return '<button '+(primary?'class="primary" ':'')+'onclick="'+fn+'">'+text+'</button>'}
function article(id=2014205){return 'https://wol.jw.org/'+t('ru/wol/d/r2/lp-u/','en/wol/d/r1/lp-e/')+id}
function field(label,html){return '<label>'+label+html+'</label>'}
function select(id,items,val){return '<select id="'+id+'">'+items.map(([v,k])=>'<option value="'+v+'" '+(String(val)===String(v)?'selected':'')+'>'+k+'</option>').join('')+'</select>'}
function eveningDate(){return iso(date(current))}
function guests(){return s.guests?.[eveningDate()]||[]}
function editGuests(){draft=guests().map(p=>({...p}));go('guests')}
function validPeople(){return [...document.querySelectorAll('#members input')].every(input=>input.reportValidity())}
function saveGuests(){
 if(!validPeople())return;
 s.guests=s.guests||{};s.guests[eveningDate()]=draft;save();go('detail')
}
function guestsScreen(){
 app.innerHTML=btn(t('← Вечер','← Evening'),"go('detail')")+'<h1>'+t('Гости','Guests')+' · '+fmt(current)+'</h1><section class="panel"><div id="members">'+people()+'</div>'+btn(t('+ Гость','+ Guest'),'addMember()')+'</section>'+btn(t('Сохранить гостей','Save guests'),'saveGuests()',true)
}
function savedIdea(){
 const idea=s.ideas?.[eveningDate()];
 return guestTopic===null&&idea?.topic===s.plan[current]&&idea?.language===lang?idea:null
}
function recordEvening(){
 const id=guestTopic??s.plan[current],key=(guestTopic===null?eveningDate():'shared-'+iso(new Date()))+'/'+id;
 const attendees=guestTopic===null?[...s.people,...guests()]:[];

async function cryptKey(secret,passphrase,unlock=false){
 const enc=new TextEncoder(),stored=unlock?JSON.parse(secret):null;
 const salt=stored?Uint8Array.from(stored.salt):crypto.getRandomValues(new Uint8Array(16));
 const iv=stored?Uint8Array.from(stored.iv):crypto.getRandomValues(new Uint8Array(12));
 const material=await crypto.subtle.importKey('raw',enc.encode(passphrase),'PBKDF2',false,['deriveKey']);
 const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:600000,hash:'SHA-256'},material,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
 if(unlock)return new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv},key,Uint8Array.from(stored.bytes)));
 const bytes=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},key,enc.encode(secret)));
 return JSON.stringify({salt:[...salt],iv:[...iv],bytes:[...bytes]})
}

 };
 const reason=error.name==='AbortError'?'timeout':error.name==='OperationError'?'pass':error instanceof TypeError?'network':error instanceof SyntaxError?'format':error.message;

function providerFailure(status,detail){
 let reason='request';
 if(status===401||/api.key.not.valid|api_key_invalid|invalid.api.key|incorrect.api.key/i.test(detail))reason='key';
 else if(status===402||/insufficient_quota|credits|billing|balance/i.test(detail))reason='billing';
 else if(status===429)reason='quota';
 else if(status===403)reason='access';
 else if(status===404)reason='model';
 else if(status>=500)reason='server';
 return Object.assign(Error(reason),{status})
}
async function requestIdeas(selectedProvider,key,prompt,signal,kind){
 const gemini=selectedProvider==='gemini';
 const models=gemini?['gemini-3.1-flash-lite','gemini-2.5-flash']:['grok-4.3'];
 const item=kind==='questions'?{type:'STRING'}:{type:'OBJECT',properties:Object.fromEntries(['title','question','discuss','activity'].map(k=>[k,{type:'STRING'}])),required:['title','question','discuss','activity']};
 for(const model of models){
  const url=gemini?'https://generativelanguage.googleapis.com/v1beta/models/'+model+':generateContent':'https://api.x.ai/v1/chat/completions';
  const body=gemini?{contents:[{parts:[{text:prompt}]}],generationConfig:{responseMimeType:'application/json',responseSchema:{type:'ARRAY',items:item}}}:
   {model,messages:[{role:'user',content:prompt+' Wrap the requested array in a JSON object with the single property "items".'}],response_format:{type:'json_object'}};
  const headers=gemini?{'x-goog-api-key':key}:{Authorization:'Bearer '+key};
  const result=await fetch(url,{method:'POST',redirect:'error',credentials:'omit',headers:{...headers,'Content-Type':'application/json'},body:JSON.stringify(body),signal});
  if(!result.ok){
   const detail=await result.text();
   if(result.status===404&&model!==models[models.length-1])continue;
   throw providerFailure(result.status,detail)
  }
  const data=await result.json();
  const raw=gemini?data.candidates?.[0]?.content?.parts?.filter(p=>!p.thought).map(p=>p.text).join(''):data.choices?.[0]?.message?.content;
  const parsed=JSON.parse(String(raw).trim().replace(/^```(?:json)?\s*|\s*```$/gi,''));
  return Array.isArray(parsed)?parsed:parsed?.items
 }
}

function upcomingEvening(){
 const now=iso(new Date());
 return s.plan.findIndex((_,i)=>iso(date(i))>=now)
}
function bankQuestion(index=current){
 if(guestTopic!==null)return null;
 return (s.bank||[]).find(item=>item.date===iso(date(index)))||null
}
function openBank(){go('bank');document.getElementById('newQuestion').focus()}
function storeQuestion(event){
 event.preventDefault();
 const field=event.target.elements.question;
 const question=field.value.trim();
 if(!question){field.focus();return}
 s.bank=s.bank||[];
 s.bank.unshift({question,date:null});
 save();render()
}
function scheduleQuestion(index){
 const next=upcomingEvening();
 if(next<0)return;
 const day=iso(date(next));
 for(const item of s.bank){if(item.date===day)item.date=null}
 s.bank[index].date=day;
 save();detail(next)
}
function deferQuestion(index){s.bank[index].date=null;save();render()}

const backupFields=['people','start','weeks','minutes','plan','guests','ideas','history','survey','bank','snack','lang','paces','shortDates'];

function backupDocument(){
 const family={};
 for(const key of backupFields)if(s[key]!==undefined)family[key]=s[key];
 return {app:'evening-together',version:1,family}
}
function validateBackup(doc){
 const reject=()=>{throw Error('Invalid family backup')};
 const obj=v=>v!==null&&typeof v==='object'&&!Array.isArray(v);
 const str=v=>typeof v==='string';
 const age=v=>v===undefined||v===''||((str(v)||typeof v==='number')&&/^\d{1,3}$/.test(String(v))&&Number(v)<=120);
 const day=v=>str(v)&&/^\d{4}-\d{2}-\d{2}$/.test(v)&&!Number.isNaN(Date.parse(v))&&new Date(v).toISOString().slice(0,10)===v;
 const id=v=>Number.isInteger(v)&&v>=0&&v<catalog.length;
 const array=(v,check)=>Array.isArray(v)&&v.every(check);
 const fields=(v,allowed)=>obj(v)&&Object.keys(v).every(k=>allowed.includes(k));
 const person=v=>fields(v,['name','age','topic','format','question'])&&str(v.name)&&age(v.age)&&topics.includes(v.topic)&&(v.format===undefined||Object.keys(formats).includes(v.format))&&(v.question===undefined||str(v.question));
 const pace=v=>['','quiet','active','light'].includes(v);
 const map=(v,keyCheck,valueCheck)=>v===undefined||(obj(v)&&Object.entries(v).every(([k,x])=>keyCheck(k)&&valueCheck(x)));
 const entry=r=>fields(r,['id','day','title','minutes','attendees','outline','pace','action'])&&(r.action===undefined||str(r.action)&&r.action.length<=300)&&id(r.id)&&day(r.day)&&str(r.title)&&Number.isInteger(r.minutes)&&r.minutes>0&&(r.pace===undefined||pace(r.pace))&&array(r.attendees,p=>fields(p,['name','age'])&&str(p.name)&&age(p.age))&&array(r.outline,x=>Array.isArray(x)&&x.length===3&&str(x[0])&&str(x[1])&&Number.isInteger(x[2])&&x[2]>0);
 if(!doc||doc.app!=='evening-together'||doc.version!==1||!fields(doc.family,backupFields))reject();
 const d=doc.family;
 if(!day(d.start)||![4,8,12].includes(d.weeks)||![30,40,60,75,90].includes(d.minutes)||!array(d.people,person)||!array(d.plan,id)||d.plan.length!==d.weeks)reject();
 if(d.lang!==undefined&&!['auto','ru','en'].includes(d.lang)||d.snack!==undefined&&typeof d.snack!=='boolean')reject();
 if(!map(d.guests,day,v=>array(v,person))||!map(d.paces,day,pace)||!map(d.shortDates,day,v=>typeof v==='boolean'))reject();
 if(!map(d.ideas,day,v=>fields(v,['topic','language','title','question','activity','discuss'])&&id(v.topic)&&['en','ru'].includes(v.language)&&[v.title,v.question,v.activity,v.discuss].every(str)))reject();
 if(!map(d.history,k=>/^(shared-)?\d{4}-\d{2}-\d{2}\/\d+(\/\d+)?$/.test(k),entry))reject();
 if(d.bank!==undefined&&!array(d.bank,v=>fields(v,['question','date'])&&str(v.question)&&(v.date===null||day(v.date))))reject();
 if(d.survey!==undefined){
  if(!Array.isArray(d.survey))reject();
  const chat=familyInterview();let turn=chat.next();
  for(const a of d.survey){
   if(turn.done||!str(a))reject();
   const q=turn.value;
   if(q.choices?!q.choices.some(([v])=>v===a):q.type==='number'?!age(a):q.type==='date'?!day(a):a.length>q.limit||!q.optional&&!a.trim())reject();
   turn=chat.next(a)
  }
 }
 return d
}

 const url=URL.createObjectURL(blob),a=document.createElement('a');

}

async function readBackup(file){
 const token=++backupRead;
 pendingBackup=null;
 const preview=document.getElementById('backupPreview');preview.textContent='';
 if(!file)return;
 try{
  const data=validateBackup(JSON.parse(await file.text()));
  if(token!==backupRead||!preview.isConnected)return;
  pendingBackup=data;
  preview.innerHTML='<p>'+backupCounts(data)+'</p><p>'+t('После подтверждения данные семьи на этом устройстве будут заменены содержимым файла.','Confirming will replace the family data on this device with the contents of this file.')+'</p>'+btn(t('Заменить и восстановить','Replace and restore'),'restoreBackup()',true)+' '+btn(t('Отмена','Cancel'),'openBackup()')
 }catch{if(token===backupRead)preview.textContent=t('Проверьте файл: нужна поддерживаемая JSON-копия «Вечера вместе». Текущие данные сохранены.','Choose a supported Evening Together JSON backup. Your current data is intact.')}
}
function openBackup(){pendingBackup=null;++backupRead;go('backup')}
function restoreBackup(){
 if(!pendingBackup||view!=='backup')return;
 try{localStorage.setItem(storageKey,JSON.stringify(pendingBackup))}
 catch{document.getElementById('backupPreview').textContent=t('Не удалось записать копию. Проверьте место в браузере.','Could not store the backup. Check browser storage.');return}
 s=pendingBackup;pendingBackup=null;current=0;go('home')
}

  s.paces=s.paces||{};

function adaptEvening(outline,c){

   [outline[2][0],question,6],
   [outline[outline.length-1][0],t('По одной фразе: что хочется взять с собой на завтра? Завершите молитвой.','In one sentence, what would you like to take into tomorrow? Conclude with prayer.'),3]
  ]
 }

 activity[0]=t(...paceLabels[pace]);
 if(pace==='active'){

  }else if(adultEvening()&&!savedIdea()){

function steps(c){
 const snack=s.snack?10:0,active=duration()-snack,read=Math.round(active*.30),discuss=Math.round(active*.25);
 const idea=savedIdea();
 const base=[[t('Начнём вместе','Gather together'),t('Начните с молитвы. ','Begin with prayer. ')+(idea?idea.question:t(c[5],c[6])),3],[t('Откроем Библию','Open the Bible'),t(c[3],c[4])+'. '+t('Прочитайте вместе. Что вы заметили в этом отрывке?','Read together. What stood out to you?'),read],[questionOwner()?t('Вопрос семьи','Family question'):t('Поговорим','Talk together'),(idea?idea.discuss:t('Как эта мысль связана с тем, что произошло у тебя на этой неделе?','How does this thought relate to something that happened this week?'))+familyQuestion(),discuss],...(snack?[[t('Перекус','Snack break'),t('Возьмите любимый семейный перекус и немного отдохните.','Enjoy a favourite family snack and take a break.'),snack]]:[]),[t('Попробуем вместе','Try it together'),idea?idea.activity:t(c[7],c[8]),active-read-discuss-6],[t('В завершение','Wrap up'),t('Поделитесь одной мыслью, которую хочется запомнить. Завершите молитвой.','Share a thought to take into the week. Conclude with prayer.'),3]];
 const planned=bankQuestion();
 const outline=planned?bankSteps(planned.question,base):base;
 if(planned&&adultEvening())outline[outline.length-2][1]=t('Возьмите пример из повседневной жизни. Обсудите два возможных решения и какое из них согласуется с прочитанным.','Take an everyday example. Consider two possible responses and which reflects the reading.');
 return adaptEvening(outline,c)
}

const tvLengths=[15,30,40,60,75,90],tvPaces=['','quiet','active','light'];
let tvRecipe=null,tvPosition=-1,tvPersonal=false;
function makeTvRecipe(includeQuestion){
 const idea=savedIdea(),bank=bankQuestion();
 const r={id:guestTopic??s.plan[current],lang,adult:adultEvening(),pace:eveningPace(),minutes:duration(),snack:!!s.snack};
 if(includeQuestion && questionOwner())r.question=questionOwner().question;
 if(includeQuestion && bank)r.bank=true;
 if(idea && !bank)r.idea=[idea.title,idea.question,idea.discuss,idea.activity];
 return r
}
function tvCode(r){return String(r.id).padStart(2,'0')+(r.lang==='en'?1:0)+Number(r.adult)+tvPaces.indexOf(r.pace)+tvLengths.indexOf(r.minutes)+Number(r.snack)}
function parseTvCode(code){
 if(!/^\d{2}[01][01][0-3][0-5][01]$/.test(code)||+code.slice(0,2)>=catalog.length)throw Error();
 const r={id:+code.slice(0,2),lang:code[2]==='1'?'en':'ru',adult:code[3]==='1',pace:tvPaces[+code[4]],minutes:tvLengths[+code[5]],snack:code[6]==='1'};
 if((r.minutes===15)!==(r.pace==='light'))throw Error();
 return r
}
function tvFragment(r){
 const code=tvCode(r);
 if(!r.idea&&!r.question)return 'tv1='+code;
 const bytes=new TextEncoder().encode(JSON.stringify([r.question||'',!!r.bank,r.idea||null]));
 const body=btoa(Array.from(bytes,b=>String.fromCharCode(b)).join('')).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
 return 'tv1='+code+'.'+body
}
function parseTvFragment(fragment){
 const parts=fragment.slice(4).split('.');
 if(parts.length>2||fragment.length>80000)throw Error();
 const r=parseTvCode(parts[0]);if(parts.length===1)return r;
 if(!/^[A-Za-z0-9_-]+$/.test(parts[1]))throw Error();
 const bytes=Uint8Array.from(atob(parts[1].replace(/-/g,'+').replace(/_/g,'/')),c=>c.charCodeAt(0));
 const values=JSON.parse(new TextDecoder().decode(bytes));
 if(!Array.isArray(values)||values.length!==3)throw Error();
 const [question,bank,idea]=values;
 if(typeof question!=='string'||question.length>400||typeof bank!=='boolean'||(bank&&!question))throw Error();
 if(idea!==null&&(!Array.isArray(idea)||idea.length!==4||idea.some(x=>typeof x!=='string'||x.length>3000)))throw Error();
 return {...r,question,bank,idea}
}

function tvOutline(r){

 try{
  current=0;guestTopic=null;lang=r.lang;
  const day='2000-01-01';
  s={start:day,plan:[r.id],people:[{age:r.adult?30:undefined,question:r.question||''}],minutes:r.minutes,snack:r.snack,paces:{[day]:r.pace}};
  if(r.bank)s.bank=[{date:day,question:r.question}];
  if(r.idea){const [title,question,discuss,activity]=r.idea;s.ideas={[day]:{topic:r.id,language:r.lang,title,question,discuss,activity}}}
  const c=topicAt();
  return {title:r.bank?r.question:savedIdea()?.title||t(c[1],c[2]),steps:steps(c),reading:r.bank?resourceLinks(r.question):chapterLink(c),questionLinks:r.question?resourceLinks(r.question):'',
   further:r.bank?'':article(({nature:2023324,friends:2015734,music:1994322,history:2014205})[c[0]])}
 }finally{s=original.s;current=original.current;guestTopic=original.guestTopic;lang=original.lang}
}

function people(){return draft.map((p,i)=>'<fieldset><legend>'+t('Участник ','Member ')+(i+1)+'</legend>'+field(t('Имя или роль','Name or role'),'<input maxlength="40" value="'+esc(p.name)+'" oninput="draft['+i+'].name=this.value">')+field(t('Возраст (по желанию)','Age (optional)'),'<input type="number" inputmode="numeric" min="0" max="120" step="1" value="'+esc(p.age??'')+'" oninput="draft['+i+'].age=this.value">')+field(t('Что тебе интересно?','What interests you?'),'<select onchange="draft['+i+'].topic=this.value">'+topics.map((v,j)=>'<option value="'+v+'" '+(v===p.topic?'selected':'')+'>'+t(...options[j])+'</option>').join('')+'</select>')+field(t('Как хочется участвовать?','How would you like to take part?'),'<select onchange="draft['+i+'].format=this.value">'+Object.entries(formats).map(([key,f])=>'<option value="'+key+'" '+(key===(p.format||'read')?'selected':'')+'>'+t(f[0],f[1])+'</option>').join('')+'</select>')+(view==='settings'?field(t('Мой вопрос для семьи','My question for the family'),'<input maxlength="240" value="'+esc(p.question||'')+'" oninput="draft['+i+'].question=this.value">'):'')+btn(t('Убрать','Remove'),'draft.splice('+i+',1);members.innerHTML=people()')+'</fieldset>').join('')}
function settings(){app.innerHTML=btn(t('← Календарь','← Calendar'),"go('home')")+'<h1>'+t('Наша семья','Our family')+'</h1><div class="panel"><h2>'+t('Интересы каждого','Everyone’s interests')+'</h2><div id="members">'+people()+'</div>'+btn(t('+ Участник','+ Family member'),"addMember()")+'</div><div class="panel">'+field(t('Первый вечер','First evening'),'<input type="date" required id="first" value="'+s.start+'">')+field(t('Недель','Weeks'),select('weeks',[4,8,12].map(v=>[v,v]),s.weeks))+field(t('Продолжительность','Duration'),select('mins',[30,40,60,75,90].map(v=>[v,v+t(' мин',' min')]),s.minutes))+field(t('Перекус','Snack break'),select('snack',[[0,t('Без перерыва','No break')],[1,t('10 минут','10 minutes')]],+!!s.snack))+'</div>'+btn(t('Составить план','Build plan'),'applyPlan()',true)+'<p><a target="_blank" rel="noopener" href="'+article()+'">'+t('Идеи для семейного поклонения · WOL','Family worship ideas · WOL')+' ↗</a></p>'}
function addMember(){draft.push({name:'',topic:topics[draft.length%4]});members.innerHTML=people();members.lastElementChild.querySelector('input').focus()}
function applyPlan(){if(!validPeople()||!first.reportValidity())return;if(draft.length)delete s.survey;s.people=draft;s.weeks=+weeks.value;s.minutes=+mins.value;s.snack=snack.value==='1';s.start=first.value;s.plan=makePlan();current=0;save();go('home')}
language.onchange=()=>{
 if(aiRequest){aiRequest.abort();aiRequest=null}
 const pending=view==='settings'?[first.value,weeks.value,mins.value,snack.value]:null;
 s.lang=language.value;
 save();
 render();
 if(pending)[first.value,weeks.value,mins.value,snack.value]=pending
};
window.addEventListener('languagechange',()=>{if(!['ru','en'].includes(s.lang))render()});
document.addEventListener('keydown',e=>{if(!['play','tv'].includes(view)||!e.key.startsWith('Arrow'))return;e.preventDefault();const nodes=Array.from(document.querySelectorAll('button,select,a[href]'));const dir=['ArrowDown','ArrowRight'].includes(e.key)?1:-1;nodes[(nodes.indexOf(document.activeElement)+dir+nodes.length)%nodes.length].focus()});
const shared=location.hash.match(/^#evening=(\d+)(&audience=adult)?$/);
if(shared && +shared[1]<catalog.length){
 guestTopic=+shared[1];sharedAdults=!!shared[2];current=0;
 view='detail'
}
if(location.hash.startsWith('#tv1=')){try{tvRecipe=parseTvFragment(location.hash.slice(1));tvPosition=-1;view='tv'}catch{view='tvEntry'}}
render()
</script></html>
