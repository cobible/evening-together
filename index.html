const addDays=(date,n)=>{const d=new Date(date);d.setDate(d.getDate()+n);return d};

const today=new Date();s.start=s.start||iso(addDays(today,(5-today.getDay()+7)%7));s.people=s.people||[];s.weeks=s.weeks||4;s.minutes=s.minutes||40;

}

async function cryptKey(secret,passphrase,unlock=false){
 const enc=new TextEncoder(),stored=unlock?JSON.parse(secret):null;
 const salt=stored?Uint8Array.from(stored.salt):crypto.getRandomValues(new Uint8Array(16));
 const iv=stored?Uint8Array.from(stored.iv):crypto.getRandomValues(new Uint8Array(12));
 const material=await crypto.subtle.importKey('raw',enc.encode(passphrase),'PBKDF2',false,['deriveKey']);
 const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:600000,hash:'SHA-256'},material,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
 if(unlock)return new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv},key,Uint8Array.from(stored.bytes)));
 const bytes=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},key,enc.encode(secret)));
 return JSON.stringify({salt:[...salt],iv:[...iv],bytes:[...bytes]})
}

 field('API key','<input id="apiKey" type="password" autocomplete="off" autocapitalize="none" spellcheck="false">')+

function aiErrorText(error,providerName){
 const prefix=(providers[providerName]||'AI')+' · ';
 const messages={
  key:['Проверьте, что ключ создан для выбранного провайдера и действует.','Check that the key is valid and was issued by the selected provider.'],
  access:['Провайдер отклонил доступ. Проверьте ограничения ключа, доступ к API и регион аккаунта.','Access denied. Check key restrictions, API access and account region.'],
  quota:['Исчерпан лимит запросов. Проверьте квоту в кабинете провайдера или попробуйте позднее.','Request limit reached. Check your provider quota or try later.'],
  billing:['Проверьте баланс и настройки оплаты API у провайдера.','Check your API credit balance and billing settings.'],
  model:['Модель недоступна для этого ключа. Проверьте доступ к моделям у провайдера.','Model unavailable for this key. Check model access with the provider.'],
  format:['Ответ пришёл в неожиданном формате. Попробуйте ещё раз.','Unexpected response format. Please try again.'],
  timeout:['Истекло время ожидания. Повторите запрос.','Request timed out. Please try again.'],
  network:['Браузер не получил ответ. Проверьте соединение и доступ к API из этой сети.','No response reached the browser. Check the connection and API access from this network.'],
  server:['Сервис временно недоступен. Повторите позже.','Service temporarily unavailable. Try again later.'],
  pass:['Не удалось открыть сохранённый ключ. Проверьте парольную фразу.','Could not unlock the saved key. Check your passphrase.'],
  request:['Провайдер отклонил запрос. Проверьте настройки API.','The provider rejected the request. Check API settings.']
 };
 const reason=error.name==='AbortError'?'timeout':error.name==='OperationError'?'pass':error instanceof TypeError?'network':error instanceof SyntaxError?'format':error.message;
 return prefix+t(...(messages[reason]||messages.request))+(error.status?' (HTTP '+error.status+')':'')
}
function providerFailure(status,detail){
 let reason='request';
 if(status===401||/api.key.not.valid|api_key_invalid|invalid.api.key|incorrect.api.key/i.test(detail))reason='key';
 else if(status===402||/insufficient_quota|credits|billing|balance/i.test(detail))reason='billing';
 else if(status===429)reason='quota';
 else if(status===403)reason='access';
 else if(status===404)reason='model';
 else if(status>=500)reason='server';
 return Object.assign(Error(reason),{status})
}
async function requestIdeas(selectedProvider,key,prompt,signal,kind){
 const gemini=selectedProvider==='gemini';
 const models=gemini?['gemini-3.1-flash-lite','gemini-2.5-flash']:['grok-4.3'];
 const item=kind==='questions'?{type:'STRING'}:{type:'OBJECT',properties:Object.fromEntries(['title','question','discuss','activity'].map(k=>[k,{type:'STRING'}])),required:['title','question','discuss','activity']};
 for(const model of models){
  const url=gemini?'https://generativelanguage.googleapis.com/v1beta/models/'+model+':generateContent':'https://api.x.ai/v1/chat/completions';
  const body=gemini?{contents:[{parts:[{text:prompt}]}],generationConfig:{responseMimeType:'application/json',responseSchema:{type:'ARRAY',items:item}}}:
   {model,messages:[{role:'user',content:prompt+' Wrap the requested array in a JSON object with the single property "items".'}],response_format:{type:'json_object'}};
  const headers=gemini?{'x-goog-api-key':key}:{Authorization:'Bearer '+key};
  const result=await fetch(url,{method:'POST',redirect:'error',credentials:'omit',headers:{...headers,'Content-Type':'application/json'},body:JSON.stringify(body),signal});
  if(!result.ok){
   const detail=await result.text();
   if(result.status===404&&model!==models[models.length-1])continue;
   throw providerFailure(result.status,detail)
  }
  const data=await result.json();
  const raw=gemini?data.candidates?.[0]?.content?.parts?.filter(p=>!p.thought).map(p=>p.text).join(''):data.choices?.[0]?.message?.content;
  const parsed=JSON.parse(String(raw).trim().replace(/^```(?:json)?\s*|\s*```$/gi,''));
  return Array.isArray(parsed)?parsed:parsed?.items
 }
}
async function generateIdeas(){
 if(aiRequest)return;
 const get=id=>document.getElementById(id),status=get('aiStatus');
 let key=get('apiKey').value.trim();
 const stored=keyForProvider(),remember=get('rememberKey').checked,phrase=get('keyPhrase').value;
 if((remember||(!key&&stored))&&!phrase){status.textContent=t('Введите парольную фразу.','Enter the passphrase.');return}
 if(!key&&!stored){status.textContent=t('Введите свой API-ключ.','Enter your API key.');return}
 const prompt=aiPrompt();
 const controller=new AbortController();aiRequest=controller;

function* familyInterview(){
 const people=[];
 const choose=(prompt,choices)=>({prompt,choices});
 const numberChoices=values=>values.map(value=>[String(value),String(value)]);
 let more=true;
 while(more){
  const name=yield {prompt:people.length?t('Передайте телефон следующему участнику. Как к вам обращаться?','Pass the phone to the next person. What should we call you?'):t('Кто первым расскажет о себе? Можно указать имя или роль в семье.','Who would like to go first? Enter your name or your role in the family.'),type:'text',limit:40};
  const age=yield {prompt:t('Сколько вам лет? Можно пропустить.','How old are you? You can skip this.'),type:'number',optional:true};
  const child=age!==''&&Number(age)<13;
  const topic=yield choose(child?t('Про что тебе было бы интересно узнать?','What would you like to explore?'):t('Какая тема вам сейчас ближе?','Which topic interests you most right now?'),topics.map((id,i)=>[id,t(...options[i])]));
  const format=yield choose(child?t('Что ты хочешь делать вместе со всеми?','What would you like to do together?'):t('Как вы хотели бы участвовать в вечере?','How would you like to take part?'),Object.entries(formats).map(([id,f])=>[id,t(f[0],f[1])]));
  const question=yield {coach:{topic,format,child},prompt:child?t('О чём ты хочешь спросить семью?','What would you like to ask your family?'):t('Есть ли вопрос, который вы хотели бы обсудить всей семьёй?','Is there a question you would like to discuss as a family?'),type:'text',limit:240,optional:true};
  people.push({name,age,topic,format,question});
  more=(yield choose(t('Кто ещё будет участвовать?','Who else is joining?'),[['add',t('Передать телефон','Pass the phone')],['done',t('Это все участники','Everyone is here')]]))==='add'
 }
 const start=yield {prompt:t('На какой день запланируем первый вечер?','When would you like your first evening to be?'),type:'date',initial:s.start};
 const minutes=yield choose(t('Сколько минут удобно выделить на вечер?','How many minutes work for your family?'),numberChoices([30,40,60,75,90]));
 const snack=yield choose(t('Включить в это время перерыв на перекус?','Include a snack break within that time?'),[['yes',t('Да, 10 минут','Yes, 10 minutes')],['no',t('Без перерыва','No break')]]);
 const weeks=yield choose(t('На сколько недель составить план?','How many weeks shall we plan?'),numberChoices([4,8,12]));
 return {people,start,minutes:Number(minutes),snack:snack==='yes',weeks:Number(weeks)}
}
function surveyState(){

  if(state.done)break;
  const q=state.value;

  messages.push([q.prompt,display||t('Пропущено','Skipped')]);state=flow.next(answer)
 }
 return {messages,state}
}

 nature:[['Вспомните по одной детали в природе, которая иллюстрирует прочитанное. Что она помогает понять об Иегове?','Recall a detail in nature that illustrates the reading. What does it help you understand about Jehovah?'],['Пройдитесь по комнате или двору. Найдите деталь, которая напоминает о прочитанном. По очереди покажите свои находки.','Walk around the room or yard. Find a detail that reminds you of the passage and take turns showing it.']],
 friends:[['Вспомните случай, когда чьи-то слова вам помогли. Какие слова из этой истории вы хотели бы сказать другу?','Recall a time someone’s words helped you. What words from that story would you like to say to a friend?'],['Разыграйте короткую сцену между двумя друзьями. Поменяйтесь ролями и попробуйте другой ответ, учитывая прочитанное.','Act out a short scene between friends. Switch roles and try another response that reflects the reading.']],
 history:[['Выберите героя из отрывка. Какое его решение вам было бы труднее всего принять? Выслушайте друг друга.','Choose someone from the passage. Which decision would have been hardest for you to make? Listen to each other.'],['Разложите три листка: начало, решение, результат. Переходите от одного к другому и рассказывайте, что произошло.','Set out three sheets for the beginning, decision and outcome. Move between them as you retell the account.']],
 music:[['Каждый может вспомнить одну песню, которая связана с прочитанным. Почему она вам дорога?','Think of a song connected to the passage. Why is it meaningful to you?'],['По очереди задавайте ритм хлопками, а остальные повторяйте. Затем вместе спойте знакомую песню по теме вечера.','Take turns clapping a rhythm for everyone to repeat. Then sing a familiar song about the evening’s theme.']]
};
function adaptEvening(outline,c){
 const pace=eveningPace();if(!pace)return outline;
 const question=questionOwner()?.question||savedIdea()?.question||t(c[5],c[6]);
 if(pace==='light'){
  return [
   [outline[0][0],t('Начните с молитвы.','Begin with prayer.'),2],
   [outline[1][0],bankQuestion()?outline[1][1]:t('Выберите один стих из отрывка: ','Choose one verse from ')+t(c[3],c[4])+'.',4],
   [outline[2][0],question,6],
   [outline[outline.length-1][0],t('По одной фразе: что хочется взять с собой на завтра? Завершите молитвой.','In one sentence, what would you like to take into tomorrow? Conclude with prayer.'),3]
  ]
 }
 const activity=outline[outline.length-2];
 const personal=bankQuestion()||savedIdea()||questionOwner();
 activity[0]=t(...paceLabels[pace]);
 if(personal){
  activity[1]=question+' '+(pace==='quiet'?t('Вспомните пример из своей жизни. Что бы вы сказали близкому человеку в такой ситуации?','Recall a personal example. What would you tell someone close to you in that situation?'):t('Покажите ситуацию по этому вопросу: один выбирает, как поступить, другой предлагает помощь. Поменяйтесь ролями.','Act out a situation related to this question: one person makes a choice, another offers help. Switch roles.'))
 }else activity[1]=t(...paceActivities[c[0]][pace==='active'?1:0]);
 return outline
}

let guestShort=false;
function shortEvening(){
 return guestTopic!==null?guestShort:!!s.shortDates?.[iso(date(current))]
}
function duration(){return eveningPace()==='light'?15:shortEvening()?30:s.minutes}
function toggleShort(){
 if(guestTopic!==null)guestShort=!guestShort;
 else{
  const key=iso(date(current));
  s.shortDates=s.shortDates||{};
  if(s.shortDates[key])delete s.shortDates[key];else s.shortDates[key]=true;
  save()
 }
 render()
}
function roles(){
 const attending=[...s.people,...guests()];
 if(guestTopic!==null||!attending.length)return '';
 const items=attending.map((person,i)=>{
  const role=formats[person.format]||formats.read;
  const name=person.name.trim()||t('Участник ','Member ')+(i+1);
  return '<li><strong>'+esc(name)+(i>=s.people.length?' · '+t('гость','guest'):'')+'</strong><span>'+t(role[2],role[3])+'</span></li>'
 });
 return '<section class="panel"><h2>'+t('Кто чем поможет','Everyone has a part')+'</h2><ul class="roles">'+items.join('')+'</ul></section>'
}
function renderEvening(c,title){
 const idea=savedIdea();
 if(idea)title=esc(idea.title);
 const bank=bankQuestion();if(bank)title=esc(bank.question);
 const dateLabel=guestTopic===null?fmt(current):t('Общая тема','Shared topic');
 const controls=[btn(t('Начать вечер →','Start evening →'),'start()',true)];

 const outline=steps(c).map(([label,description,minutes],index)=>{
  const link=index===1&&!bank?'<p>'+chapterLink(c)+'</p>':'';
  return '<li><div><strong>'+label+'</strong><p>'+esc(description)+'</p>'+link+'</div><small>'+minutes+t(' мин',' min')+'</small></li>'
 }).join('');
 app.innerHTML=btn(t('← План','← Planner'),"go('home')")+
  '<section class="hero"><div class="meta">'+dateLabel+' · '+duration()+t(' мин',' min')+'</div><h1>'+title+'</h1><p>'+(bank?t('Из вашей копилки','From your question box'):idea?esc(idea.question):t(c[5],c[6]))+'</p><div class="row">'+controls.join('')+(guestTopic===null?btn(t('Гости на вечер','Evening guests'),'editGuests()')+(bank?'':btn(t('Идеи с ИИ','AI ideas'),'openAI()')):'')+(idea?btn(t('Вернуть обычную программу','Restore original outline'),'restoreOutline()'):'')+'</div></section>'+
  pacePicker()+questionCard(questionOwner())+'<div class="evening-grid"><section class="panel"><h2>'+t('Программа','Evening outline')+'</h2><ol class="outline">'+outline+'</ol></section><aside>'+roles()+
  (bank?'':'<section class="panel"><h2>'+t('К подготовке','Prepare together')+'</h2><p>'+chapterLink(c)+'</p><p><a target="_blank" rel="noopener" href="'+article(({nature:2023324,friends:2015734,music:1994322,history:2014205})[c[0]])+'">'+t('Дополнительная статья · WOL','Further reading · WOL')+' ↗</a></p></section>')+'</aside></div>'+
  '<div class="row">'+(bank?btn(t('В копилку','Open question box'),"go('bank')"):btn(t('Заменить тему','Change topic'),'swap()'))+btn(t('Поделиться темой','Share topic'),'shareTopic()')+'</div><div id="sharebox"></div>'
}

function steps(c){
 const snack=s.snack?10:0,active=duration()-snack,read=Math.round(active*.30),discuss=Math.round(active*.25);
 const idea=savedIdea();
 const base=[[t('Начнём вместе','Gather together'),t('Начните с молитвы. ','Begin with prayer. ')+(idea?idea.question:t(c[5],c[6])),3],[t('Откроем Библию','Open the Bible'),t(c[3],c[4])+'. '+t('Прочитайте вместе. Что вы заметили в этом отрывке?','Read together. What stood out to you?'),read],[questionOwner()?t('Вопрос семьи','Family question'):t('Поговорим','Talk together'),(idea?idea.discuss:t('Как эта мысль связана с тем, что произошло у тебя на этой неделе?','How does this thought relate to something that happened this week?'))+familyQuestion(),discuss],...(snack?[[t('Перекус','Snack break'),t('Возьмите любимый семейный перекус и немного отдохните.','Enjoy a favourite family snack and take a break.'),snack]]:[]),[t('Попробуем вместе','Try it together'),idea?idea.activity:t(c[7],c[8]),active-read-discuss-6],[t('В завершение','Wrap up'),t('Поделитесь одной мыслью, которую хочется запомнить. Завершите молитвой.','Share a thought to take into the week. Conclude with prayer.'),3]];
 const planned=bankQuestion();return adaptEvening(planned?bankSteps(planned.question,base):base,c)
}
function play(c){const list=steps(c),x=list[step];app.innerHTML=btn(t('← Выйти','← Exit'),"go('detail')")+'<section class="hero"><div class="meta">'+(step+1)+' / '+list.length+' · '+x[2]+t(' мин',' min')+'</div><h1>'+x[0]+'</h1><p>'+esc(x[1])+'</p>'+(step===1?(bankQuestion()?resourceLinks(bankQuestion().question):chapterLink(c)):step===2&&questionOwner()?resourceLinks(questionOwner().question):'')+'</section><div class="row">'+(step?btn(t('Назад','Back'),'move(-1)'):'')+btn(step===list.length-1?t('Завершить','Finish'):t('Дальше →','Next →'),'move(1)',true)+'</div>';app.querySelector('.primary').focus()}
function go(v){if(aiRequest){aiRequest.abort();aiRequest=null}if(v==='home'){guestTopic=null;if(location.hash)history.replaceState(null,'',location.href.split('#')[0])}view=v;render();scrollTo(0,0)}
function detail(i){current=i;go('detail')}
function start(){step=0;go('play')}
function move(n){step+=n;if(step>=steps(catalog[guestTopic??s.plan[current]]).length){recordEvening();go('home')}else render()}
function swap(){if(guestTopic!==null){guestTopic=(guestTopic+1)%catalog.length;render();return}let id=s.plan[current];do{id=(id+1)%catalog.length}while(s.plan.length<catalog.length&&s.plan.includes(id));const j=s.plan.indexOf(id);if(j>=0)s.plan[j]=s.plan[current];s.plan[current]=id;save();render()}
function shareTopic(){
 const url=new URL(location.href);url.hash='evening='+(guestTopic??s.plan[current]);
 const copyOutline=!!eveningPace()||location.protocol==='file:'||!!savedIdea()||!!bankQuestion();
 const msg=copyOutline?t('Для отправки скопируйте программу','Copy the outline to share'):t('Ссылка на тему','Topic link');
 const value=copyOutline?[bankQuestion()?.question||savedIdea()?.title||document.title,...steps(catalog[guestTopic??s.plan[current]]).map(x=>x[0]+' — '+x[1])].join(' / '):url.href;
 sharebox.innerHTML=field(msg,'<input readonly value="'+esc(value)+'">');const input=sharebox.querySelector('input');input.focus();input.select()
}
function edit(){draft=s.people.map(p=>({...p}));if(!draft.length)draft.push({name:'',topic:'nature'});go('settings')}
function people(){return draft.map((p,i)=>'<fieldset><legend>'+t('Участник ','Member ')+(i+1)+'</legend>'+field(t('Имя или роль','Name or role'),'<input maxlength="40" value="'+esc(p.name)+'" oninput="draft['+i+'].name=this.value">')+field(t('Возраст (по желанию)','Age (optional)'),'<input type="number" inputmode="numeric" min="0" max="120" step="1" value="'+esc(p.age??'')+'" oninput="draft['+i+'].age=this.value">')+field(t('Что тебе интересно?','What interests you?'),'<select onchange="draft['+i+'].topic=this.value">'+topics.map((v,j)=>'<option value="'+v+'" '+(v===p.topic?'selected':'')+'>'+t(...options[j])+'</option>').join('')+'</select>')+field(t('Как хочется участвовать?','How would you like to take part?'),'<select onchange="draft['+i+'].format=this.value">'+Object.entries(formats).map(([key,f])=>'<option value="'+key+'" '+(key===(p.format||'read')?'selected':'')+'>'+t(f[0],f[1])+'</option>').join('')+'</select>')+(view==='settings'?field(t('Мой вопрос для семьи','My question for the family'),'<input maxlength="240" value="'+esc(p.question||'')+'" oninput="draft['+i+'].question=this.value">'):'')+btn(t('Убрать','Remove'),'draft.splice('+i+',1);members.innerHTML=people()')+'</fieldset>').join('')}
function settings(){app.innerHTML=btn(t('← Календарь','← Calendar'),"go('home')")+'<h1>'+t('Наша семья','Our family')+'</h1><div class="panel"><h2>'+t('Интересы каждого','Everyone’s interests')+'</h2><div id="members">'+people()+'</div>'+btn(t('+ Участник','+ Family member'),"addMember()")+'</div><div class="panel">'+field(t('Первый вечер','First evening'),'<input type="date" required id="first" value="'+s.start+'">')+field(t('Недель','Weeks'),select('weeks',[4,8,12].map(v=>[v,v]),s.weeks))+field(t('Продолжительность','Duration'),select('mins',[30,40,60,75,90].map(v=>[v,v+t(' мин',' min')]),s.minutes))+field(t('Перекус','Snack break'),select('snack',[[0,t('Без перерыва','No break')],[1,t('10 минут','10 minutes')]],+!!s.snack))+'</div>'+btn(t('Составить план','Build plan'),'applyPlan()',true)+'<p><a target="_blank" rel="noopener" href="'+article()+'">'+t('Идеи для семейного поклонения · WOL','Family worship ideas · WOL')+' ↗</a></p>'}
function addMember(){draft.push({name:'',topic:topics[draft.length%4]});members.innerHTML=people();members.lastElementChild.querySelector('input').focus()}
function applyPlan(){if(!validPeople()||!first.reportValidity())return;if(draft.length)delete s.survey;s.people=draft;s.weeks=+weeks.value;s.minutes=+mins.value;s.snack=snack.value==='1';s.start=first.value;s.plan=makePlan();current=0;save();go('home')}
language.onchange=()=>{
 if(aiRequest){aiRequest.abort();aiRequest=null}
 const pending=view==='settings'?[first.value,weeks.value,mins.value,snack.value]:null;
 s.lang=language.value;
 save();
 render();
 if(pending)[first.value,weeks.value,mins.value,snack.value]=pending
};
window.addEventListener('languagechange',()=>{if(!['ru','en'].includes(s.lang))render()});
document.addEventListener('keydown',e=>{if(view!=='play'||!e.key.startsWith('Arrow'))return;e.preventDefault();const nodes=Array.from(document.querySelectorAll('button,select,a[href]'));const dir=['ArrowDown','ArrowRight'].includes(e.key)?1:-1;nodes[(nodes.indexOf(document.activeElement)+dir+nodes.length)%nodes.length].focus()});
const shared=location.hash.match(/^#evening=(\d+)$/);
if(shared && +shared[1]<catalog.length){
 guestTopic=+shared[1];current=0;
 view='detail'
}
render()
</script></html>
